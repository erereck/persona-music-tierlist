name: Apply known English track titles

on:
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply-known-english-track-titles.mjs
      - .github/workflows/apply-known-english-track-titles.yml

permissions:
  contents: write

jobs:
  translate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply translations
        run: node scripts/apply-known-english-track-titles.mjs
      - name: Commit updated track titles
        run: |
          if git diff --quiet -- public/tracks.json; then
            echo "No title changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/tracks.json
          git commit -m "Translate known Japanese track titles"
          git push origin HEAD:${{ github.head_ref }}
